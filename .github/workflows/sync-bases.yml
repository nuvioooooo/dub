name: Domain kontrol ve güncelleme

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

env:
  TZ: Europe/Istanbul

permissions:
  contents: write

concurrency:
  group: sync-bases
  cancel-in-progress: false

jobs:
  domain-kontrolu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Paketleri yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Domainleri kontrol et ve base adreslerini güncelle
        run: python scripts/sync_bases.py
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name 'Domain Kontrol Botu'
          git config user.email 'bot@github-actions'
          git add dublaj_kaynaklari.json eklenti_domainleri.txt
          if git diff --staged --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "🔄 base adresleri güncellendi - $(date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((i * 5))
          done
          exit 1
